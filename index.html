<style>
:root{font-family:Arial,Helvetica,"Helvetica Neue",sans-serif;color:#1a1a1a;background:#f4f7fb;--ink:#0f172a;--muted:#3f4c63;--soft:#5b667a;--line:#e6eaf0;--card:#fff;--green:#087443;--green-bg:#e9f8ef;--red:#c73545;--red-bg:#fff0f1;--blue:#275bc5;--blue-bg:#eef4ff;--amber:#a15c00;--amber-bg:#fff7e6;--shadow:0 10px 28px rgba(25,42,70,.07);--radius:16px}

.header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}.brand{display:flex;align-items:center;gap:13px}.logo{display:grid;place-items:center;width:45px;height:45px;border-radius:13px;background:#1f5cc9;color:#fff;font-weight:800;box-shadow:0 7px 15px rgba(39,91,197,.22)}
h1{font-size:1.48rem;letter-spacing:-.03em;color:#262626;font-weight:800}.brand p{font-size:.86rem;color:#555555;margin-top:3px;font-weight:600}
.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:7px 12px;color:#555555;font-size:.76rem;font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:#12a150;box-shadow:0 0 0 4px #e5f7ec}
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi,.card,.side,.panel,.comment{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpi{padding:16px 17px;position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#4c7ee8}
.eyebrow{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:#555555}
.kpi .value{font-size:1.48rem;font-weight:850;letter-spacing:-.04em;margin:8px 0 3px;color:#262626}
.kpi .sub{font-size:.76rem;color:#555555;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{padding:17px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cat{display:flex;align-items:center;gap:10px}.icon{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;background:var(--blue-bg);border:1px solid #d9e5ff;font-size:1rem}
.cat h3{font-size:.94rem;color:#262626;letter-spacing:-.01em;font-weight:800}.cat span{display:block;color:#666666;font-size:.71rem;margin-top:2px;font-weight:650}
.tag{white-space:nowrap;border-radius:999px;padding:5px 9px;font-size:.7rem;font-weight:800;background:var(--blue-bg);color:var(--blue)}
.tag.green{background:var(--green-bg);color:var(--green)}.tag.red{background:var(--red-bg);color:var(--red)}.tag.amber{background:var(--amber-bg);color:var(--amber)}
.level{font-size:1.32rem;font-weight:850;letter-spacing:-.035em;color:#262626}.level small{font-size:.7rem;font-weight:700;color:#666666;margin-left:6px;letter-spacing:0}
.table{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.thead,.tr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(7.5rem,auto) minmax(4.5rem,auto);gap:6px;align-items:center}
.thead{background:#f1f5f9;color:#666666;font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:7px 10px}
.thead span:not(:first-child),.tr span:not(:first-child){text-align:right}
.tr{padding:8px 10px;border-top:1px solid #eef1f5;font-size:.77rem;min-height:35px}
.tr .name{color:#555555;font-weight:650;overflow:hidden;text-overflow:ellipsis}
.tr .val{font-weight:750;color:#172033;font-variant-numeric:tabular-nums}
.change{font-weight:800;font-variant-numeric:tabular-nums}.up{color:var(--green)!important}.down{color:var(--red)!important}.flat{color:#7a8699!important}.dash{color:#64748b;font-weight:700}.tr span:not(.name){white-space:nowrap;font-variant-numeric:tabular-nums}.tr .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:.7rem;color:#666666;font-weight:600;margin-top:-5px}
.news{border-top:1px solid var(--line);padding-top:11px;margin-top:auto}
.news-label{font-size:.65rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#1d4ed8;margin-bottom:5px}
.news p{font-size:.8rem;color:#333333;font-weight:600;line-height:1.5}
.comment{margin-top:14px;padding:22px 24px;background:linear-gradient(135deg,#fff,#f7fbff);border:1px solid #dbe4f0}
.comment .badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:#eef4ff;color:#1d4ed8;font-size:.7rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px}
.comment h2{font-size:1.05rem;font-weight:800;color:#262626;letter-spacing:-.02em;margin-bottom:10px}
.comment p{font-size:.88rem;color:#333333;font-weight:600;line-height:1.68;margin-bottom:12px}.comment p:last-child{margin-bottom:0}.comment strong{color:#262626;font-weight:800}
.spotlight{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-top:14px}
.panel{padding:19px 21px;background:linear-gradient(135deg,#eef5ff,#fff)}
.panel h2,.side h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#275bc5;margin-bottom:11px}
.panel ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.panel li{font-size:.86rem;color:#262626;font-weight:650;display:flex;gap:9px}
.panel li:before{content:"";width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:#f0a62b;margin-top:7px}
.side{padding:19px 21px}.side h2{color:#667085}
.cal{display:flex;flex-direction:column;gap:8px}
.cal-item{display:flex;gap:12px;padding:9px 11px;background:#fafbfc;border:1px solid var(--line);border-radius:10px;font-size:.77rem}
.when{color:#1d4ed8;font-weight:800;min-width:58px}.what{color:#262626;font-weight:650}
.legend{margin-top:17px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;color:#666666;font-size:.72rem;font-weight:600}
.legend b{font-size:.7rem;color:#555555}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%}
.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:17px;color:#64748b;font-size:.7rem;font-weight:600}.source{color:#666666}
.err{padding:24px;border:1px solid #fecaca;background:#fff1f2;border-radius:16px;color:#9f1239;font-weight:700}

@media(max-width:700px){body{padding:16px}.hero,.grid{grid-template-columns:1fr}.header{align-items:flex-start}.thead,.tr{grid-template-columns:minmax(0,1fr) minmax(6.5rem,auto) minmax(3.75rem,auto)}.tr{font-size:.72rem}.thead{font-size:.58rem}}


.carousel-wrap{margin:0 0 18px}
.carousel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.carousel-head h2{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#1d4ed8;font-weight:800;margin:0}
.carousel-hint{font-size:.72rem;font-weight:700;color:#7a8699}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:4px 2px 12px;scrollbar-width:thin}
.carousel::-webkit-scrollbar{height:6px}
.carousel::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
.c-card{flex:0 0 min(78vw,320px);scroll-snap-align:start;background:linear-gradient(160deg,#0f172a,#1e3a5f);color:#fff;border-radius:18px;padding:18px 18px 16px;box-shadow:0 12px 28px rgba(15,23,42,.22);min-height:148px;position:relative;overflow:hidden}

.c-card .c-val{font-size:1.85rem;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.c-card .c-chg{margin-top:8px;font-size:.95rem;font-weight:800}
.c-card .c-sub{margin-top:6px;font-size:.72rem;font-weight:650;color:#94a3b8}
.c-card.geo{background:linear-gradient(160deg,#1e1b4b,#312e81)}
.c-card.geo .c-lab{color:#c4b5fd}
.c-card.geo .c-val{font-size:1.05rem;line-height:1.35;font-weight:800;letter-spacing:-.01em}
.c-dots{display:flex;gap:6px;justify-content:center;margin-top:2px}
.c-dots i{width:7px;height:7px;border-radius:50%;background:#cbd5e1;display:inline-block}
.c-dots i.on{background:#2563eb}

.live-board{margin:0 0 18px;padding:14px 16px;background:#fff;border:1px solid #dbe4f0;border-radius:16px;box-shadow:0 10px 28px rgba(25,42,70,.07)}
.live-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.live-head h2{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#1d4ed8;font-weight:800;margin:0}
.live-status{font-size:.72rem;font-weight:700;color:#555}
.live-status.ok{color:#087443}.live-status.bad{color:#a15c00}
.live-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.live-item{background:#f8fafc;border:1px solid #e6eaf0;border-radius:12px;padding:10px 10px 9px}
.live-item .k{font-size:.65rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#666;margin-bottom:4px}
.live-item .live-value{font-size:1.05rem;font-weight:800;color:#262626;font-variant-numeric:tabular-nums;white-space:nowrap}
.live-item .live-chg{font-size:.78rem;font-weight:800;margin-top:4px;min-height:1.2em;line-height:1.25}
.kpi.is-live{outline:1px solid rgba(8,116,67,.25)}
@media(max-width:1100px){.live-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){.live-grid{grid-template-columns:repeat(2,1fr)}}

.geo-feed{margin:0 0 18px;background:#fff;border:1px solid #dbe4f0;border-radius:16px;box-shadow:0 10px 28px rgba(25,42,70,.07);overflow:hidden}
.geo-feed-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px 10px;border-bottom:1px solid #eef1f5}
.geo-feed-head h2{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#1d4ed8;font-weight:800;margin:0}
.geo-feed-head .sub{font-size:.72rem;font-weight:700;color:#666}
.geo-item{padding:16px 18px 15px;border-top:1px solid #eef1f5}
.geo-item:first-of-type{border-top:none}
.geo-item .meta-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
.geo-item .geo-tag{display:inline-flex;padding:3px 8px;border-radius:999px;background:#eef4ff;color:#1d4ed8;font-size:.65rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.geo-item .geo-tag.oil{background:#fff0f1;color:#c73545}
.geo-item .geo-tag.uscn{background:#e9f8ef;color:#087443}
.geo-item .geo-tag.eu{background:#fff7e6;color:#a15c00}
.geo-item .when{font-size:.68rem;font-weight:700;color:#7a8699}
.geo-item h3{font-size:1.02rem;font-weight:800;color:#1a1a1a;letter-spacing:-.02em;line-height:1.35;margin:0 0 8px}
.geo-item p{font-size:.86rem;color:#333;font-weight:600;line-height:1.55;margin:0}
.geo-item a.more{display:inline-block;margin-top:8px;font-size:.78rem;font-weight:700;color:#275bc5;text-decoration:none}
.analysis{margin:0 0 18px;padding:22px 24px;background:linear-gradient(135deg,#fff,#f7fbff);border:1px solid #dbe4f0;border-radius:16px;box-shadow:0 10px 28px rgba(25,42,70,.07)}
.analysis .badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:#eef4ff;color:#1d4ed8;font-size:.7rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px}
.analysis h2{font-size:1.05rem;font-weight:800;color:#262626;letter-spacing:-.02em;margin-bottom:10px}
.analysis p{font-size:.88rem;color:#333;font-weight:600;line-height:1.68;margin-bottom:12px}
.analysis p:last-child{margin-bottom:0}
.analysis strong{color:#262626;font-weight:800}
.tr.is-live .name{color:#0f172a}.tr.is-live .change.live-day{font-weight:800}.live-item.is-closed .live-chg,.tr.is-closed .name{color:#7a8699}.card .level.is-live{outline:1px solid rgba(8,116,67,.22);outline-offset:2px;border-radius:6px}
.section-label{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#667085;font-weight:800;margin:4px 0 10px}

</style>

<body>
<div class="shell" id="app"><div class="err">Đang tải dữ liệu… cần cả <code>index.html</code> và <code>data.js</code> trong cùng thư mục.</div></div>
<script>document.write('<script src="./data.js?v='+Date.now()+'"><\/script>');</script>
<script>
(function () {
  var d = window.MACRO_DATA;
  var app = document.getElementById('app');
  if (!d) {
    app.innerHTML = '<div class="err">Không đọc được data.js. Hãy để <b>index.html</b> và <b>data.js</b> cùng một thư mục, rồi mở bằng Chrome/Safari.</div>';
    return;
  }
  function esc(s){return String(s==null?'':s)}
  function cell(v, cls){
    if (v === '—' || v == null || v === '') return '<span class="dash">—</span>';
    if (cls === 'val') return '<span class="val">'+esc(v)+'</span>';
    var c = cls ? ('change '+cls) : 'change';
    if (cls === 'up' || cls === 'down' || cls === 'flat') return '<span class="'+c+'">'+esc(v)+'</span>';
    return '<span class="'+c+'">'+esc(v)+'</span>';
  }
  var m = d.meta;
  var html = '';
  html += '<header class="header"><div class="brand"><div class="logo">ME</div><div><h1>'+esc(m.title)+'</h1><p>'+esc(m.subtitle)+'</p></div></div><div class="meta"><div class="pill"><i class="dot"></i>'+esc(m.status)+'</div><div class="pill">'+esc(m.dateLabel)+'</div><div class="pill">'+esc(m.asOf)+'</div></div></header>';
  html += '<section class="carousel-wrap" id="share-carousel"><div class="carousel-head"><h2>Live snapshot · vuốt ngang</h2><div class="carousel-hint" id="carousel-asof">Updating…</div></div><div class="carousel" id="carousel">'
    + '<article class="c-card" data-c="dxy"><div class="c-lab">DXY</div><div class="c-val">—</div><div class="c-chg"></div><div class="c-sub">Dollar index</div></article>'
    + '<article class="c-card" data-c="ust10y"><div class="c-lab">UST 10Y</div><div class="c-val">—</div><div class="c-chg"></div><div class="c-sub">Yield · bp ngày</div></article>'
    + '<article class="c-card" data-c="vnindex"><div class="c-lab">VN-Index</div><div class="c-val">—</div><div class="c-chg"></div><div class="c-sub">Vs prior close</div></article>'
    + '<article class="c-card" data-c="wti"><div class="c-lab">WTI</div><div class="c-val">—</div><div class="c-chg"></div><div class="c-sub">Oil · Investing</div></article>'
    + '<article class="c-card" data-c="eurusd"><div class="c-lab">EUR/USD</div><div class="c-val">—</div><div class="c-chg"></div><div class="c-sub">FX</div></article>'
    + '<article class="c-card" data-c="gold"><div class="c-lab">Gold</div><div class="c-val">—</div><div class="c-chg"></div><div class="c-sub">Spot / futures</div></article>'
    + '<article class="c-card geo" data-c="geo"><div class="c-lab">Geo Pulse 24h</div><div class="c-val" id="c-geo-hd">—</div><div class="c-sub" id="c-geo-tag">Tin nổi bật</div></article>'
    + '</div><div class="c-dots" id="c-dots"></div></section>';

  html += '<section class="live-board" id="live-board"><div class="live-head"><h2>Near real-time · Investing.com (delayed)</h2><div class="live-status" id="live-status">Chờ quote…</div></div><div class="live-grid">'
    +'<div class="live-item" id="live-dxy"><div class="k">DXY</div><div class="live-value">—</div><div class="live-chg"></div></div>'
    +'<div class="live-item" id="live-ust10y"><div class="k">UST 10Y</div><div class="live-value">—</div><div class="live-chg"></div></div>'
    +'<div class="live-item" id="live-ust2y"><div class="k">UST 2Y</div><div class="live-value">—</div><div class="live-chg"></div></div>'
    +'<div class="live-item" id="live-vn"><div class="k">VN-Index</div><div class="live-value">—</div><div class="live-chg"></div></div>'
    +'<div class="live-item" id="live-usdvnd"><div class="k">USD/VND</div><div class="live-value">—</div><div class="live-chg">FX mid</div></div>'
    +'<div class="live-item" id="live-eurusd"><div class="k">EUR/USD</div><div class="live-value">—</div><div class="live-chg">FX mid</div></div>'
    +'<div class="live-item" id="live-usdjpy"><div class="k">USD/JPY</div><div class="live-value">—</div><div class="live-chg">FX mid</div></div>'
    +'</div></section>';
  html += '<div class="section-label">Bảng chỉ số chi tiết</div>';
  html += '<section class="grid">'+(d.cards||[]).map(function(c){
    var tag = '<span class="tag'+(c.tagClass?(' '+c.tagClass):'')+'">'+esc(c.tag)+'</span>';
    var cols = c.cols||['Chỉ số','% ngày','% tuần'];
    var thead = '<div class="thead"><span>'+esc(cols[0])+'</span><span>'+esc(cols[1])+'</span><span>'+esc(cols[2])+'</span></div>';
    var rows = (c.rows||[]).map(function(r){
      var liveAttr='';
      var nk = r.live || '';
      if (!nk) {
        if (/^DXY\b/i.test(r.name)) nk='dxy';
        else if (/^2Y\s*UST|^UST\s*2Y/i.test(r.name)) nk='ust2y';
        else if (/^10Y\s*UST|^UST\s*10Y/i.test(r.name)) nk='ust10y';
        else if (/^2s10s/i.test(r.name)) nk='ust2s10s';
        else if (/^VN-Index/i.test(r.name)) nk='vnindex';
        else if (/EUR\/USD/i.test(r.name)) nk='eurusd';
        else if (/GBP\/USD/i.test(r.name)) nk='gbpusd';
        else if (/USD\/JPY/i.test(r.name)) nk='usdjpy';
        else if (/AUD\/USD/i.test(r.name)) nk='audusd';
        else if (/SBV\s*USD\/VND|USD\/VND/i.test(r.name)) nk='usdvnd';
        else if (/^WTI\b/i.test(r.name)) nk='wti';
        else if (/^Brent\b/i.test(r.name)) nk='brent';
        else if (/^Gold\b/i.test(r.name)) nk='gold';
        else if (/^S&P\s*500/i.test(r.name)) nk='spx';
        else if (/^Nasdaq/i.test(r.name)) nk='ndx';
        else if (/^Dow\b/i.test(r.name)) nk='dji';
        else if (/^Russell/i.test(r.name)) nk='rut';
      }
      if (nk) liveAttr=' data-live-row="'+nk+'"';
      return '<div class="tr"'+liveAttr+'><span class="name">'+esc(r.name)+'</span>'+cell(r.day,r.dayClass||'')+cell(r.week,r.weekClass||'')+'</div>';
    }).join('');
    var liveLevel='';
    if (/^DXY$/i.test(c.title)) liveLevel=' data-live-level="dxy"';
    else if (/Oil|Commodities/i.test(c.title)) liveLevel=' data-live-level="wti"';
    else if (/Việt Nam/i.test(c.title)) liveLevel=' data-live-level="vnindex"';
    else if (/US Bond Yields/i.test(c.title)) liveLevel=' data-live-level="ust10y"';
    else if (/Equities/i.test(c.title)) liveLevel=' data-live-level="spx"';
    else if (/FX/i.test(c.title)) liveLevel=' data-live-level="eurusd"';
    return '<article class="card"><div class="card-top"><div class="cat"><div class="icon">'+esc(c.icon)+'</div><div><h3>'+esc(c.title)+'</h3><span>'+esc(c.subtitle)+'</span></div></div>'+tag+'</div><div class="level"'+liveLevel+'>'+esc(c.level)+(c.levelSmall?'<small>'+esc(c.levelSmall)+'</small>':'')+'</div><div class="table">'+thead+rows+'</div><div class="note">'+esc(c.note)+'</div><div class="news"><div class="news-label">Điểm nhấn</div><p>'+esc(c.news)+'</p></div></article>';
  }).join('')+'</section>';
  html += '<div class="section-label">Tin địa chính trị · 24h</div>';
  var geo = d.geoNews || {};
  html += '<section class="geo-feed"><div class="geo-feed-head"><h2>'+esc(geo.title||'Geo Pulse · Tin quan trọng')+'</h2><div class="sub">'+esc(geo.window||'24h gần nhất')+'</div></div>';
  (geo.items||[]).forEach(function(it){
    var tagCls = it.tagClass ? (' '+it.tagClass) : '';
    html += '<article class="geo-item"><div class="meta-row">';
    if (it.tag) html += '<span class="geo-tag'+tagCls+'">'+esc(it.tag)+'</span>';
    if (it.when) html += '<span class="when">'+esc(it.when)+'</span>';
    html += '</div><h3>'+esc(it.headline)+'</h3><p>'+esc(it.summary)+'</p>';
    if (it.url) html += '<a class="more" href="'+esc(it.url)+'" target="_blank" rel="noopener">Đọc nguồn</a>';
    html += '</article>';
  });
  if (!(geo.items||[]).length) html += '<article class="geo-item"><p>Chưa có tin Geo Pulse trong cửa sổ 24h — sẽ cập nhật khi có brief.</p></article>';
  html += '</section>';

  var cm = d.comment||{};
  html += '<div class="section-label">Nhận định · đánh giá · dự đoán</div>';
  html += '<section class="analysis"><div class="badge">'+esc(cm.badge||'Macro Eco · Bình luận')+'</div><h2>'+esc(cm.title||'Nhận định chung tình hình')+'</h2>'+(cm.paragraphs||[]).map(function(p){return '<p>'+p+'</p>';}).join('')+'</section>';

  html += '<section class="spotlight"><div class="panel"><h2>Bottom line hôm nay</h2><ul>'+(d.bottomLine||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div><div class="side"><h2>Lịch catalyst</h2><div class="cal">'+(d.catalysts||[]).map(function(x){return '<div class="cal-item"><span class="when">'+esc(x.when)+'</span><span class="what">'+esc(x.what)+'</span></div>';}).join('')+'</div></div></section>';
  html += '<div class="legend"><b>Quy ước:</b><span><i style="background:#087443"></i> tăng</span><span><i style="background:#c73545"></i> giảm</span><span><i style="background:#a7b0bd"></i> chưa có dữ liệu = —</span><span>Fed: vs kỳ gần nhất · Inflation: MoM/YoY · còn lại: % ngày/% tuần</span></div>';
  var f = d.footer||{};
  html += '<footer class="footer"><span>'+esc(f.left||'')+'</span><span class="source">'+esc(f.source||'')+'</span></footer>';
  app.innerHTML = html;
  (function initCarousel(){
    var track = document.getElementById('carousel');
    var dots = document.getElementById('c-dots');
    if (track && dots) {
      var cards = track.querySelectorAll('.c-card');
      dots.innerHTML = Array.prototype.map.call(cards, function(_,i){ return '<i'+(i===0?' class="on"':'')+'></i>'; }).join('');
      track.addEventListener('scroll', function(){
        var i = Math.round(track.scrollLeft / Math.max(track.firstElementChild.offsetWidth,1));
        Array.prototype.forEach.call(dots.children, function(el,j){ el.classList.toggle('on', j===i); });
      }, {passive:true});
    }
    var geo = (d.geoNews && d.geoNews.items && d.geoNews.items[0]) || null;
    if (geo) {
      var hd = document.getElementById('c-geo-hd');
      var tg = document.getElementById('c-geo-tag');
      if (hd) hd.textContent = geo.headline || '—';
      if (tg) tg.textContent = (geo.tag || 'Geo') + (geo.when ? (' · ' + geo.when) : '');
    }
  })();
  document.title = (m.title||'Macro Markets') + ' · ' + (m.dateLabel||'');
})();
</script>
<script>document.write('<script src="./live.js?v='+Date.now()+'"><\/script>');</script>
</body>
</html>
